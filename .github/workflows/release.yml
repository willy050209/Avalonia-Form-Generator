name: Release Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-binaries:
    name: Publish Standalone Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            output_name: AFG-win-x64.zip
            artifact_dir: publish/win-x64
          - os: windows-latest
            target: win-arm64
            output_name: AFG-win-arm64.zip
            artifact_dir: publish/win-arm64
          - os: ubuntu-latest
            target: linux-x64
            output_name: AFG-linux-x64.tar.gz
            artifact_dir: publish/linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            output_name: AFG-linux-arm64.tar.gz
            artifact_dir: publish/linux-arm64
          - os: macos-latest
            target: osx-x64
            output_name: AFG-osx-x64.tar.gz
            artifact_dir: publish/osx-x64
          - os: macos-latest
            target: osx-arm64
            output_name: AFG-osx-arm64.tar.gz
            artifact_dir: publish/osx-arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK (net10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File Binary
        run: >
          dotnet publish src/AFG.Desktop/AFG.Desktop.csproj
          -c Release
          -r ${{ matrix.target }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./${{ matrix.artifact_dir }}

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ./${{ matrix.artifact_dir }}/* -DestinationPath ./${{ matrix.output_name }}

      - name: Package Unix Artifacts
        if: runner.os != 'Windows'
        run: |
          tar -czvf ./${{ matrix.output_name }} -C ./${{ matrix.artifact_dir }} .

      - name: Upload Artifact Asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ./${{ matrix.output_name }}

  create-github-release:
    name: Create GitHub Release
    needs: publish-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
