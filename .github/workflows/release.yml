name: Release Publish

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 全平台嚴格測試階段 (Windows / Linux / macOS 全部通過方可進入發布流程)
  run-tests:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK (net10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run All Unit & Integration Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  # 2. 跨平台單一執行檔編譯與打包 (只有在 run-tests 全部成功通過時才會觸發)
  publish-binaries:
    name: Publish Standalone Binary (${{ matrix.target }})
    needs: run-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            output_name: AFG-win-x64.zip
            artifact_dir: publish/win-x64
          - os: ubuntu-latest
            target: linux-x64
            output_name: AFG-linux-x64.tar.gz
            artifact_dir: publish/linux-x64
          - os: macos-latest
            target: osx-x64
            output_name: AFG-osx-x64.tar.gz
            artifact_dir: publish/osx-x64
          - os: macos-latest
            target: osx-arm64
            output_name: AFG-osx-arm64.tar.gz
            artifact_dir: publish/osx-arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK (net10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File Binary
        run: >
          dotnet publish src/AFG.Desktop/AFG.Desktop.csproj
          -c Release
          -r ${{ matrix.target }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./${{ matrix.artifact_dir }}

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ./${{ matrix.artifact_dir }}/* -DestinationPath ./${{ matrix.output_name }}

      - name: Package Unix Artifacts
        if: runner.os != 'Windows'
        run: |
          tar -czvf ./${{ matrix.output_name }} -C ./${{ matrix.artifact_dir }} .

      - name: Upload Artifact Asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ./${{ matrix.output_name }}

  # 3. 建立 GitHub Release 並上傳發布資產 (只有在測試與打包皆為成功時才會觸發)
  create-github-release:
    name: Create GitHub Release
    needs: [run-tests, publish-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
